# Start HyperParallel FSDP2 full fine-tuning on multiple GPUs or NPUs.
# CUDA:
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 accelerate launch \
#       --config_file examples/accelerate/fsdp2_config_qwen35.yaml \
#       src/train.py examples/train_full/qwen3_8_full_sft_hyper_fsdp2.yaml
# Ascend:
#   ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 accelerate launch \
#       --config_file examples/accelerate/fsdp2_config_qwen35.yaml \
#       src/train.py examples/train_full/qwen3_8_full_sft_hyper_fsdp2.yaml
#
# Qwen3.8-27B uses the Qwen3.5 model implementation, so its FSDP2 wrap classes
# are defined by examples/accelerate/fsdp2_config_qwen35.yaml. For a different
# device count, copy both YAML files into a run directory and set num_processes
# in the copied Accelerate config to the number of visible devices.

### model
model_name_or_path: Qwen/Qwen3.8-27B
trust_remote_code: true
use_v1_kernels: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
use_hyper_parallel: true

### dataset
dataset: alpaca_en_demo
template: qwen3_8
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/Qwen3.8-27B/full/sft
logging_steps: 1
save_steps: 500
max_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 1800
resume_from_checkpoint: null
